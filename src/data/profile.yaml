# One or two sentences under the name in the hero: the kinds of questions, not the thesis title.
tagline: >-
  I study how intelligent agents decide together — forming groups, sharing resources and
  learning from one another as information arrives over time — and design algorithms that
  keep such systems, from agent coalitions to large language models, fair, stable and safe.

# The fields the work belongs to (shown quietly under the tagline).
areas: [Game theory, Computational social choice, Multi-agent systems, Machine learning, Online learning, Large language models]

# Short paragraphs for the About section (Markdown links allowed: [text](url)).
bio:
  - I am a Postdoctoral Research Associate in the Department of Computer Science at the University of Oxford, hosted by Prof. Michael Wooldridge.
  - My research sits where game theory and computational social choice meet multi-agent systems and machine learning. I ask what guarantees are still possible when self-interested agents interact, share resources or learn under uncertainty, often when decisions must be made online, before the future is known.
  - My doctoral work at Bar-Ilan University, with [Prof. Noa Agmon](https://u.cs.biu.ac.il/~agmon/), developed a theory of online coalition formation. My current work extends to online fair division and allocation, learning in strategic environments, principled graph learning, and game-theoretic approaches to the safety of large language models.

# Research themes on the home page. A paper belongs to a theme when it carries one of the
# theme's `topics`. `areas` are the fields each theme draws on.
themes:
  - id: collective-decisions
    title: Coalitions & collective decisions
    areas: [Game theory, Computational social choice]
    topics: [coalition-formation]
    summary: How self-interested agents group together, and which guarantees of stability, welfare and fairness survive when groups form online, one arrival at a time.
  - id: fair-allocation
    title: Fair allocation over time
    areas: [Computational social choice, Online algorithms]
    topics: [fair-division, clustering]
    summary: Dividing goods, houses and resources that arrive sequentially and must be assigned irrevocably or with limited recourse, and how far subsidies, resource augmentation or predictions can restore fairness.
  - id: multiagent-learning
    title: Learning in multi-agent systems
    areas: [Online learning, Reinforcement learning, Multi-agent systems]
    topics: [multi-agent-learning, multi-robot-systems]
    summary: Agents that learn their preferences and strategies from feedback, from online and offline learning of stable partitions to coordination in multi-agent reinforcement learning and robot swarms.
  - id: safe-principled-ai
    title: Principled & safe AI
    areas: [Machine learning, Large language models, AI safety]
    topics: [graph-learning, ai-safety]
    summary: Learning architectures with provable guarantees, such as convexified graph neural networks, and game-theoretic methods that make large language models safer.

