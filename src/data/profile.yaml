# One sentence shown under the name in the hero.
tagline: I study how self-interested agents form coalitions when they arrive one at a time and the future is uncertain.

# Short paragraphs for the About section (Markdown links allowed: [text](url)).
bio:
  - I am a Postdoctoral Research Associate in the Department of Computer Science at the University of Oxford, hosted by Prof. Michael Wooldridge.
  - My research focuses on coalition formation that continuously evolves over time. My doctoral work gave a theoretical analysis of online coalition formation in its most general form, under online and uncertain settings where agents arrive one at a time. Online algorithms must decide which coalition an arriving agent should join, if any, while keeping a good solution over time, both theoretically and empirically.
  - Because the problem is interdisciplinary, I build on machine learning, reinforcement learning, graph theory and algorithmic game theory.

# Research themes. `id` is referenced by `topics:` in publications.yaml.
themes:
  - id: online-coalition-formation
    title: Online coalition formation
    summary: Agents arrive one at a time and must be assigned to coalitions irrevocably, without knowing who comes next. Which guarantees on welfare, fairness and stability can an online algorithm still offer?
  - id: learning-coalitions
    title: Learning coalition structures
    summary: When agents' preferences are initially unknown, stable and fair partitions must be learned from feedback, whether online, offline, or by decentralized selfish agents.
  - id: online-allocation
    title: Online allocation & clustering
    summary: Allocating items and clustering elements that arrive over time, under random-order and stochastic arrival models.
  - id: graph-learning
    title: Graphs, learning & multi-agent systems
    summary: Convexified graph neural networks, multi-agent reinforcement learning, and coordination and control in robotic swarms.

