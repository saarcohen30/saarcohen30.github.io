- id: online-house-allocation-subsidy
  title: Online House Allocation with Subsidy
  authors: [Nicholas Teh, Saar Cohen, Karen Frilya Celine, Benjamin Yu, Michael J. Wooldridge]
  type: working-paper
  date: 2026-08-31
  topics: [fair-division, online-algorithms, computational-social-choice, learning-augmented]
  links:
    arxiv: "2609.29691"
  abstract: >-
    House allocation is a fundamental problem in which each agent is assigned exactly one house.
    While the classical model assumes that all houses are available before the allocation is
    computed, many practical settings require decisions to be made as houses become available over
    time. We introduce the online house allocation problem, where houses arrive sequentially and the
    algorithm must maintain an allocation without knowledge of future arrivals. Unlike online fair
    division, the one-house-per-agent constraint makes recourse an inherent part of the problem, as
    accepting a newly arrived house may require reassigning previously allocated houses. We study
    online house allocation under subsidy-based fairness, where monetary subsidies eliminate envy
    among agents. We show that envy-freeability can always be maintained online using bounded
    recourse and that reassignment chains of length linear in the number of agents are unavoidable
    in the worst case. In contrast, minimizing the total subsidy is fundamentally harder: no
    deterministic online algorithm against an adaptive adversary, and no randomized online algorithm
    against a non-adaptive adversary, admits a bounded competitive ratio, even for two agents and
    four houses. We complement these impossibilities by showing that exact online subsidy
    minimization is possible whenever there is at most one extra house beyond the number of agents,
    and that this guarantee is best possible with respect to the number of extra houses. Finally, we
    develop learning-augmented algorithms that recover the offline optimum under accurate
    predictions while providing explicit robustness guarantees when predictions are inaccurate.

- id: online-fair-division-oblivious-adversary
  title: Online Fair Division Against an Oblivious Adversary
  authors: [Saar Cohen, Nicholas Teh, Michael Wooldridge]
  type: working-paper
  date: 2026-09-23
  topics: [fair-division, online-algorithms, computational-social-choice]
  links:
    arxiv: "2609.28333"
  abstract: >-
    We study the online allocation of indivisible goods among n agents, where each good must be
    allocated immediately and irrevocably upon arrival. Against an adaptive adversary, Neoh and Teh
    [2026] proved that no algorithm can guarantee a positive approximation to proportionality up to
    one good (PROP1) that is independent of the number of goods, and the same holds for
    proportionality up to k goods (PROPk) for any fixed k. We instead consider an oblivious
    adversary, which fixes the input in advance. Choo et al. [2026] showed that the uniformly random
    allocation returns a Θ(1/log(n/δ))-PROP1 allocation with probability at least 1−δ. We improve
    this to Ω(1/log log(n/δ)); our algorithm does not take δ as input, so the same algorithm
    achieves this bound for every δ ∈ (0,1). Moreover, with the same probability, a variant of our
    algorithm gives every agent almost her bundle, and even without adding any good when no single
    good is too valuable relative to this share. In contrast, for envy-freeness up to one good
    (EF1), we show that, for every α ∈ (0,1], every randomized algorithm has an input on which its
    probability of returning an α-EF1 allocation is at most e^(−Ω(n)). For envy-freeness up to any
    good (EFX), this probability is at most 1/n! with only n+1 goods, a bound that is optimal within
    a factor of (n+1)/2. For the maximin share (MMS), this probability is at most 5/6, however small
    α is. Allowing more removals gives a positive envy-freeness guarantee: allocating each good to a
    uniformly random agent among those with positive values achieves, with high probability, an
    approximation factor arbitrarily close to one for envy-freeness up to logarithmically many
    goods, and logarithmically many goods are necessary for this rule.

- id: online-fair-division-budget-constraints
  title: Online Fair Division with Budget Constraints
  authors: [Saar Cohen, Nicholas Teh, Paul W. Goldberg, Michael J. Wooldridge]
  type: working-paper
  date: 2026-07-25
  topics: [fair-division, online-algorithms, computational-social-choice, learning-augmented]
  links:
    arxiv: "2607.23310"
  abstract: >-
    We study an online variant of discrete fair division under generalized assignment budget
    constraints. Goods arrive one at a time and must be assigned irrevocably to a feasible agent or
    to charity, which holds all unallocated goods, while fairness is evaluated only against
    budget-feasible subsets of every recipient's bundle. We first show that, without additional
    structure, no deterministic online algorithm can guarantee any fixed approximation to feasible
    envy-freeness, even in highly symmetric instances. We then identify bounded density spread as a
    structural condition that restores meaningful guarantees, obtaining approximation algorithms for
    arbitrary item sizes and showing that, under common valuations and sufficiently small goods,
    these guarantees can be strengthened to an optimal deterministic frontier. We further study
    resource augmentation, where the online algorithm is allowed slightly larger budgets than the
    fairness benchmark, and characterize the resulting improvement in the achievable guarantees.
    Finally, we develop a learning-augmented framework based on predicting joint value-size types,
    proving consistency under perfect predictions, robustness to prediction error, and showing that
    separate predictions of value and size marginals are insufficient to recover strong fairness
    guarantees.

