- id: attacker-in-the-mirror-anchored-bipolicy-self-play
  title: "The Attacker in the Mirror: Breaking Self-Consistency in Safety via Anchored Bipolicy Self-Play"
  authors: [Gabriele La Malfa, Emanuele La Malfa, Saar Cohen, Jie M. Zhang, Michael Luck, Michael Wooldridge, Elizabeth Black]
  type: conference
  status: to-appear
  presentation: oral   # acceptance and Oral per the author (Sept 2026); official NeurIPS pages not yet public
  year: 2026
  date: 2026-12
  venue:
    name: Proceedings of the 40th Annual Conference on Neural Information Processing Systems
    acronym: NeurIPS
  topics: [ai-safety, large-language-models, game-theory, machine-learning]
  links:
    arxiv: "2605.08427"
    code: https://github.com/EmanueleLM/AnchoredBipolicySelf-Play
    data:
      - { label: LoRA checkpoints, url: "https://huggingface.co/EmanueleLaMalfa/AnchoredBipolicySelf-Play" }
  abstract: >-
    Self-play red team is an established approach to improving AI safety in which different
    instances of the same model play attacker and defender roles in a zero-sum game, i.e., where the
    attacker tries to jailbreak the defender; if self-play converges to a Nash equilibrium, the
    model is guaranteed to respond safely within the settings of the game. Although the parameter
    sharing enforced by the use of the same model for the two roles improves stability and
    performance, it introduces fundamental theoretical and architectural limitations. We show that
    the set of Nash equilibria that can be reached corresponds to a broad class of behaviours that
    includes trivial always refuse strategies and oracle-like defenders, thus limiting practical
    applicability. We then show that when attacker and defender share and update the same base
    model, the dynamics collapse to self-consistency, so that attacks do not enforce adversarial
    pressure on the defender. In response, we propose Anchored Bipolicy Self-Play, which trains
    distinct role-specific LoRA adapters on top of a frozen base model, thereby maintaining stable
    optimisation while preserving adversarial pressure through explicit role separation. In relation
    to standard self-play, we show up to 100x greater parameter efficiency than finetuning and
    consistent improvements in safety compared to self-play fine-tuned models. We evaluate on
    Qwen2.5-{3B, 7B,14B}-IT models across widely used safety benchmarks, showing improved robustness
    without loss of reasoning ability. Cross-play experiments further show that our attacker and
    defender models are superior to self-play in terms of adversarial defence and safety.

- id: offline-learning-nash-stable-overlapping-coalitions
  title: Offline Learning of Nash Stable Coalition Structures with Possibly Overlapping Coalitions
  authors: [Saar Cohen]
  type: conference
  year: 2026
  date: 2026-05-29
  venue:
    acronym: AAMAS
    name: Proceedings of the 25th International Conference on Autonomous Agents and Multiagent Systems
  topics: [coalition-formation, multi-agent-learning, game-theory]
  links:
    pdf: https://ifaamas.org/Proceedings/aamas2026/pdfs/ZZZS1209.pdf
    doi: 10.65109/zzzs1209
    arxiv: 2602.14321
    code: https://github.com/saarcohen30/pocf
  aliases: [/publication/2026-offline]
  abstract: >-
    Coalition formation concerns strategic collaborations of selfish agents that form coalitions
    based on their preferences. It is often assumed that coalitions are disjoint and preferences are
    fully known, which may not hold in practice. In this paper, we thus present a new model of
    coalition formation with possibly overlapping coalitions under partial information, where
    selfish agents may be part of multiple coalitions simultaneously and their full preferences are
    initially unknown. Instead, information about past interactions and associated utility feedback
    is stored in a fixed offline dataset, and we aim to efficiently infer the agents' preferences
    from this dataset. We analyze the impact of diverse dataset information constraints by studying
    two types of utility feedback that can be stored in the dataset: agent- and coalition-level
    utility feedback. For both feedback models, we identify assumptions under which the dataset
    covers sufficient information for an offline learning algorithm to infer preferences and use
    them to recover a partition that is (approximately) Nash stable, in which no agent can improve
    her utility by unilaterally deviating. Our additional goal is devising algorithms with low
    sample complexity, requiring only a small dataset to obtain a desired approximation to Nash
    stability. Under agent-level feedback, we provide a sample-efficient algorithm proven to obtain
    an approximately Nash stable partition under a sufficient and necessary assumption on the
    information covered by the dataset. However, under coalition-level feedback, we show that only
    under a stricter assumption is sufficient for sample-efficient learning. Still, in multiple
    cases, our algorithms' sample complexity bounds have optimality guarantees up to logarithmic
    factors. Finally, extensive experiments show that our algorithm converges to a low approximation
    level to Nash stability across diverse settings.

- id: delayed-assignments-online-non-centroid-clustering
  title: Delayed Assignments in Online Non-Centroid Clustering with Stochastic Arrivals
  authors: [Saar Cohen]
  type: conference
  year: 2026
  date: 2026-05-29
  venue:
    acronym: AAMAS
    name: Proceedings of the 25th International Conference on Autonomous Agents and Multiagent Systems
  topics: [clustering, online-algorithms]
  links:
    pdf: https://ifaamas.org/Proceedings/aamas2026/pdfs/AVAR7513.pdf
    doi: 10.65109/avar7513
    arxiv: 2601.16091
  aliases: [/publication/2026-delays]
  abstract: >-
    Clustering is a fundamental problem, aiming to partition a set of elements, like agents or data
    points, into clusters such that elements in the same cluster are closer to each other than to
    those in other clusters. In this paper, we present a new framework for studying online
    non-centroid clustering with delays, where elements, that arrive one at a time as points in a
    finite metric space, should be assigned to clusters, but assignments need not be immediate.
    Specifically, upon arrival, each point's location is revealed, and an online algorithm has to
    irrevocably assign it to an existing cluster or create a new one containing, at this moment,
    only this point. However, we allow decisions to be postponed at a delay cost, instead of
    following the more common assumption of immediate decisions upon arrival. This poses a critical
    challenge: the goal is to minimize both the total distance costs between points in each cluster
    and the overall delay costs incurred by postponing assignments. In the classic worst-case
    arrival model, where points arrive in an arbitrary order, no algorithm has a competitive ratio
    better than sublogarithmic in the number of points. To overcome this strong impossibility, we
    focus on a stochastic arrival model, where points' locations are drawn independently across time
    from an unknown and fixed probability distribution over the finite metric space. We offer hope
    for beyond worst-case adversaries: we devise an algorithm that is constant competitive in the
    sense that, as the number of points grows, the ratio between the expected overall costs of the
    output clustering and an optimal offline clustering is bounded by a constant.

- id: convexified-message-passing-graph-neural-networks
  title: Convexified Message-Passing Graph Neural Networks
  authors: [Saar Cohen, Noa Agmon, Uri Shaham]
  type: conference
  year: 2026
  date: 2026-05-02
  venue:
    acronym: AISTATS
    name: Proceedings of the 29th International Conference on Artificial Intelligence and Statistics
    pages: 676–684
    series: Proceedings of Machine Learning Research
    volume: 300
  presentation: poster   # virtual.aistats.org/virtual/2026/poster/13693
  topics: [graph-learning, machine-learning]
  links:
    paper: https://proceedings.mlr.press/v300/cohen26a.html
    openreview: https://openreview.net/forum?id=IrQumNXKy5
    pdf: https://raw.githubusercontent.com/mlresearch/v300/main/assets/cohen26a/cohen26a.pdf
    arxiv: 2505.18289
    code: https://github.com/saarcohen30/cgcn
  aliases: [/publication/2026-CGNN]
  abstract: >-
    Graph Neural Networks (GNNs) are key tools for graph representation learning, demonstrating
    strong results across diverse prediction tasks. In this paper, we present Convexified
    Message-Passing Graph Neural Networks (CGNNs), a novel and general framework that combines the
    power of message-passing GNNs with the tractability of convex optimization. By mapping their
    nonlinear filters into a reproducing kernel Hilbert space, CGNNs transform training into a
    convex optimization problem, which projected gradient methods can solve both efficiently and
    optimally. Convexity further allows CGNNs' statistical properties to be analyzed accurately and
    rigorously. For two-layer CGNNs, we establish rigorous generalization guarantees, showing
    convergence to the performance of an optimal GNN. To scale to deeper architectures, we adopt a
    principled layer-wise training strategy. Experiments on benchmark datasets show that CGNNs
    significantly exceed the performance of leading GNN models, obtaining 10-40% higher accuracy in
    most cases, underscoring their promise as a powerful and principled method with strong
    theoretical foundations. In rare cases where improvements are not quantitatively substantial,
    the convex models either slightly exceed or match the baselines, stressing their robustness and
    wide applicability. Though over-parameterization is often used to enhance performance in
    non-convex models, we show that our CGNNs yield shallow convex models that can surpass
    non-convex ones in accuracy and model compactness.

# ── 2025 ─────────────────────────────────────────────────────────────────────

- id: online-learning-fair-coalition-structures
  title: Online Learning of Fair Coalition Structures
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2025
  date: 2025-10-25
  venue:
    acronym: ECAI
    name: Proceedings of the 28th European Conference on Artificial Intelligence
    series: Frontiers in Artificial Intelligence and Applications
  topics: [coalition-formation, multi-agent-learning, online-learning, computational-social-choice]
  links:
    paper: https://ebooks.iospress.nl/volumearticle/76341
    doi: 10.3233/FAIA251405
  abstract: >-
    Coalition formation concerns partitioning agents into disjoint coalitions based on their
    preferences for one another. In online learning of coalition structures, agents’ true
    preferences may be initially unknown. Thus, coalitions are repeatedly formed based on
    preferences learned online from iterative feedback derived from interactions in those
    coalitions. This work introduces a new fairness-oriented approach to online learning in
    coalition formation, relying only on partial noisy feedback observed after agents interact. We
    analyze the system in terms of envy-based fairness notions. Envy-freeness is a popular
    criterion, where no agent prefers another agent’s coalition over her own. While trivial
    envy-free solutions exist for unconstrained number of coalitions and coalition sizes,
    constraints may make envy-free partitions unattainable. We thus present a new
    envy-freeness-based metric into hedonic games: minimax envy partitions, which minimize the
    maximum envy experienced by any agent. We devise an algorithm designed to minimize maximum envy,
    proven to attain sublinear envy regret.

- id: decentralized-online-learning-selfish-agents-coalition-formation
  title: Decentralized Online Learning by Selfish Agents in Coalition Formation
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2025
  date: 2025-08-16
  venue:
    acronym: IJCAI
    name: Proceedings of the 34th International Joint Conference on Artificial Intelligence
    pages: 3796–3804
  topics: [coalition-formation, multi-agent-learning, online-learning, game-theory]
  links:
    paper: https://www.ijcai.org/proceedings/2025/422
    doi: 10.24963/ijcai.2025/422
  aliases: [/publication/2025-Decentralized-OL-ASHG]
  abstract: >-
    Coalition formation involves self-organized coalitions generated through strategic interactions
    of autonomous selfish agents. In online learning of coalition structures, agents' preferences
    toward each other are initially unknown before agents interact. Coalitions are formed
    iteratively based on preferences that agents learn online from repeated feedback resulting from
    their interactions. In this paper, we introduce online learning in coalition formation through
    the lens of distributed decision-making, where self-interested agents operate without global
    coordination or information sharing, and learn only from their own experience. Under our selfish
    perspective, each agent seeks to maximize her own utility. Thus, we analyze the system in terms
    of Nash stability, where no agent can improve her utility by unilaterally deviating. We devise a
    sample-efficient decentralized algorithm for selfish agents that minimize their Nash regret,
    yielding approximately Nash stable solutions. In our algorithm, each agent uses only one utility
    feedback per round to update her strategy, but our algorithm still has Nash regret and sample
    complexity bounds that are optimal up to logarithmic factors.

- id: egalitarianism-online-coalition-formation
  title: Egalitarianism in Online Coalition Formation
  note: Extended Abstract
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2025
  date: 2025-05-19
  venue:
    acronym: AAMAS
    name: Proceedings of the 24th International Conference on Autonomous Agents and Multiagent Systems
    pages: 2475–2477
  presentation: poster   # AAMAS 2025 poster schedule (Poster Session 6)
  topics: [coalition-formation, online-algorithms, computational-social-choice]
  links:
    pdf: https://www.ifaamas.org/Proceedings/aamas2025/pdfs/p2475.pdf
    doi: 10.65109/glkn7757
  aliases: [/publication/2025-egal]
  abstract: >-
    We investigate the online coalition formation problem, where agents arrive one by one and must
    be assigned to coalitions, with their utilities for others revealed upon arrival. Our focus lies
    on additively separable hedonic games, where agents assign cardinal utilities to others, assumed
    to be controlled by an adversary in our online context. This paper introduces the evaluation of
    partitions based on their egalitarian social welfare, with the goal of maximizing the minimum
    utility of any agent. This objective strikes balance between fairness and efficiency by
    prioritizing the satisfaction of the least well-off agents. For various real-life scenarios, we
    establish tight or nearly tight upper bounds on the competitive ratio and complement these
    findings with optimal or near-optimal algorithms. However, we also demonstrate that in some
    cases, no competitive algorithm is feasible. In particular, under the classic worst-case
    adversarial model, where agents arrive in an arbitrary order, we show that no algorithm has a
    non-trivial competitive ratio, if at all.

- id: online-learning-coalition-structures-selfish-agents
  title: Online Learning of Coalition Structures by Selfish Agents
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2025
  date: 2025-02-25
  venue:
    acronym: AAAI
    name: Proceedings of the 39th AAAI Conference on Artificial Intelligence
    volume: 39
    number: 13
    pages: 13709–13717
  presentation: oral   # AAAI-25 Main Track Oral Talks Schedule (aaai.org, Feb 2025)
  topics: [coalition-formation, multi-agent-learning, online-learning, game-theory]
  links:
    paper: https://ojs.aaai.org/index.php/AAAI/article/view/33498
    doi: 10.1609/aaai.v39i13.33498
  aliases: [/publication/2025-OL-ASHGs-NS]
  abstract: >-
    Coalition formation concerns autonomous agents that strategically interact to form
    self-organized coalitions. When agents lack initial sufficient information to evaluate their
    preferences before interacting with others, they learn them online through repeated feedback
    while iteratively forming coalitions. In this work, we introduce online learning in coalition
    formation from a non-cooperative perspective, studying the impact of collective data utilization
    where selfish agents aim to accelerate their learning by leveraging a shared data platform.
    Thus, the efficiency and dynamics of the learning process are affected by each agent's local
    feedbacks, motivating us to explore the tension between semi-bandit and bandit feedback, which
    differ in the granularity of utility information observed by each agent. Under our
    non-cooperative viewpoint, we evaluate the system by means of Nash stability, where no agent can
    improve her utility by unilaterally deviating. Our main result is a sample-efficient algorithm
    for selfish agents that aims to minimize their Nash regret under both semi-bandit and bandit
    feedback, implying approximately Nash stable outcomes. Under both feedback settings, our
    algorithm enjoys Nash regret and sample complexity bounds that are optimal up to logarithmic
    factors.

