- id: online-friends-partitioning-under-uncertainty
  title: Online Friends Partitioning under Uncertainty
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2024
  date: 2024-10-19
  venue:
    acronym: ECAI
    name: Proceedings of the 27th European Conference on Artificial Intelligence
    series: Frontiers in Artificial Intelligence and Applications
  topics: [coalition-formation, online-algorithms]
  links:
    paper: https://ebooks.iospress.nl/volumearticle/69977
    doi: 10.3233/FAIA240882
  aliases: [/publication/2024-Online-Friends-Partitioning]
  abstract: >-
    We study the friendship-based online coalition formation problem, in which agents that appear
    one at a time should be partitioned into coalitions, and an agent’s utility for a coalition is
    the number of her neighbors (i.e., friends) within the coalition. Unlike prior work, agents’
    friendships may be uncertain. We analyze the desirability of the resulting partition in the
    common term of optimality, aiming to maximize the social welfare. We design an online algorithm
    termed Maximum Predicted Coalitional Friends (MPCF), which is enhanced with predictions of each
    agent’s number of friends within any possible coalition. For common classes of random graphs, we
    prove that MPCF is optimal, and, for certain graphs, provides the same guarantee as the best
    known competitive algorithm for settings without uncertainty.

- id: online-learning-partitions-additively-separable-hedonic-games
  title: Online Learning of Partitions in Additively Separable Hedonic Games
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2024
  date: 2024-08-03
  venue:
    acronym: IJCAI
    name: Proceedings of the 33rd International Joint Conference on Artificial Intelligence
    pages: 2722–2730
  topics: [coalition-formation, multi-agent-learning, online-learning]
  links:
    paper: https://www.ijcai.org/proceedings/2024/301
    doi: 10.24963/ijcai.2024/301
  aliases: [/publication/2024-ASHG-OL]
  abstract: >-
    Coalition formation involves partitioning agents into disjoint coalitions based on their
    preferences over other agents. In reality, agents may lack enough information to assess their
    preferences before interacting with others. This motivates us to initiate the research on
    coalition formation from the viewpoint of online learning. At each round, a possibly different
    subset of a given set of agents arrives, that a learner then partitions into coalitions. Only
    afterwards, the agents' preferences, which possibly change over time, are revealed. The
    learner's goal is optimizing social cost by minimizing his (static or dynamic) regret. We show
    that even no-static regret is hard to approximate, and constant approximation in polynomial time
    is unattainable. Yet, for a fractional relaxation of our problem, we devise an algorithm that
    simultaneously gives the optimal static and dynamic regret. We then present a rounding scheme
    with an optimal dynamic regret, which converts our algorithm's output into a solution for our
    original problem.

- id: near-optimal-online-resource-allocation-random-order-extended-abstract
  title: Near-Optimal Online Resource Allocation in the Random-Order Model
  note: Extended Abstract
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2024
  date: 2024-05-06
  venue:
    acronym: AAMAS
    name: Proceedings of the 23rd International Conference on Autonomous Agents and Multiagent Systems
    pages: 2219–2221
  presentation: poster   # AAMAS 2024 poster schedule for extended abstracts
  topics: [fair-division, online-algorithms, computational-social-choice]
  links:
    pdf: https://ifmas.csc.liv.ac.uk/Proceedings/aamas2024/pdfs/p2219.pdf
    doi: 10.65109/koyf1641
  aliases: ["/publication/2024-online fair division"]
  abstract: >-
    We study the problem of allocating either divisible or indivisible items (goods or chores) among
    a set of agents, where the items arrive online, one at a time. Each agent's non-negative value
    for an item is set by an adversary upon the item's arrival. Our focus is on a unifying
    algorithmic framework for finding online allocations that treats both fairness and economic
    efficiency. For this sake, we aim to optimize the generalized means of agents' received values,
    covering a spectrum of welfare functions including average utilitarian welfare and egalitarian
    welfare. In the traditional adversarial model, where items arrive in an arbitrary order, no
    algorithm can give a decent approximation to welfare in the worst case. To escape from this
    strong lower bound, we consider the random-order model, where items arrive in a uniformly random
    order. This model provides us with a major breakthrough: we devise algorithms that guarantee a
    nearly-optimal competitive ratio for certain welfare functions, if the welfare obtained by the
    optimal allocation is sufficiently large. We prove that our results are almost tight: if the
    optimal solution's welfare is strictly below a certain threshold, then no nearly-optimal
    algorithm exists, even in the random-order model.

# ── 2023 ─────────────────────────────────────────────────────────────────────

- id: online-coalitional-skill-formation
  title: Online Coalitional Skill Formation
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2023
  date: 2023-05-29
  venue:
    acronym: AAMAS
    name: Proceedings of the 22nd International Conference on Autonomous Agents and Multiagent Systems
    pages: 494–503
  topics: [coalition-formation, online-algorithms, multi-agent-systems]
  links:
    pdf: https://ifaamas.org/Proceedings/aamas2023/pdfs/p494.pdf
    doi: 10.65109/krok2976
    code: https://github.com/saarcohen30/ocsf
  aliases: [/publication/2023-ocsf]
  abstract: >-
    Efficiently allocating heterogeneous tasks to agents that arrive dynamically and have diverse
    skills is a central problem in multi-agent systems called online task allocation. In many cases,
    a single agent does not meet the skill levels required by a particular task, which incentivizes
    the agents to form coalitions for handling it. In this paper, we propose a new framework, termed
    as online coalitional skill formation (OCSF), for handling online task allocation via coalition
    formation, where tasks require different skills for being successfully fulfilled, and each agent
    has different levels at mastering each skill. The goal of the organizer is therefore to assign
    agents that arrive online to a coalition responsible for performing some task, so as to
    optimally approach the desired skill levels of all tasks. Focusing on the case in which the set
    of possible mastering levels for each skill is discrete, we suggest different assignment
    algorithms based on the knowledge the organizer has on the arriving agents. When agents arrive
    i.i.d. according to some unknown distribution, we propose a greedy and adaptive scheme that
    assigns an agent to a task, proving a tight bound on the system's performance. If the
    distribution is known, we devise a novel correlation to Constrained Markov Decision Processes
    whose goal is maximizing the rate at which agents are assigned to each task while respecting
    their requirements. We then construct a non-adaptive approach that terminates when all the
    tasks' requirements are met. Finally, if the distribution is unknown, we provide two algorithms
    that learn it online. We have fully implemented the algorithms, showing that in many cases a
    higher diversity in skills may yield poor assignments.

- id: coalition-formation-sequential-decision-making-doctoral-consortium
  title: Coalition Formation in Sequential Decision-Making under Uncertainty
  note: Doctoral Consortium
  authors: [Saar Cohen]
  type: conference
  year: 2023
  date: 2023-05-29
  venue:
    acronym: AAMAS
    name: Proceedings of the 22nd International Conference on Autonomous Agents and Multiagent Systems
    pages: 2955–2957
  topics: [coalition-formation, online-algorithms]
  links:
    pdf: https://ifaamas.org/Proceedings/aamas2023/pdfs/p2955.pdf
    doi: 10.65109/ibpr3809
    code: https://github.com/saarcohen30/ocsf
  abstract: >-
    As real-world applications of coalition formation continuously evolve, the design of new
    efficient algorithms that maintain a decent and consistent solution over time is required.
    Specifically, when agents arrive one at a time, a moderator (i.e., an online algorithm) must
    decide to which coalition the agent should be assigned, if at all. Each agent may be further
    accompanied with relevant information (e.g., her set of capabilities, her preferences over the
    previously disclosed agents), based on which the moderator performs its decisions. Multi-agent
    systems further encompass uncertainties in a variety of forms: the nature of the agents'
    participation and arrivals may be probabilistic or even unknown. Additionally, their preferences
    might be not assured and even incomplete or strategic. This research will thus lay the
    theoretical foundations for studying the interplay between coalition formation and online,
    uncertain settings, while characterizing the factors which make the moderator's objective
    susceptible. Our methods will be further tied to practical applications, specifically ones in
    physical settings (e.g., task allocation in actual robots).

- id: probabilistic-inference-random-dichotomous-hedonic-games
  title: Complexity of Probabilistic Inference in Random Dichotomous Hedonic Games
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2023
  date: 2023-02-07
  venue:
    acronym: AAAI
    name: Proceedings of the 37th AAAI Conference on Artificial Intelligence
    volume: 37
    number: 5
    pages: 5573–5581
  presentation: poster   # AAAI-23 Thursday poster session; not in the oral technical schedule
  topics: [coalition-formation, game-theory]
  links:
    paper: https://ojs.aaai.org/index.php/AAAI/article/view/25692
    pdf: https://u.cs.biu.ac.il/~agmon/CohenAAAI23.pdf
    doi: 10.1609/aaai.v37i5.25692
  aliases: [/publication/2023-complexity-prob]
  abstract: >-
    Hedonic games model cooperative games where agents desire to form coalitions, and only care
    about the composition of the coalitions of which they are members. Focusing on various classes
    of dichotomous hedonic games, where each agent either approves or disapproves a given coalition,
    we propose the random extension, where players have an independent participation probability. We
    initiate the research on the computational complexity of computing the probability that
    coalitions and partitions are optimal or stable. While some cases admit efficient algorithms
    (e.g., agents approve only few coalitions), they become computationally hard (#P-hard) in their
    complementary scenario. We then investigate the distribution of coalitions in perfect partitions
    and their performance in majority games, where an agent approves coalitions in which the agent
    is friends with the majority of its members. When friendships independently form with a constant
    probability, we prove that the number of coalitions of size 3 converges in distribution to a
    Poisson random variable.

# ── 2022 ─────────────────────────────────────────────────────────────────────

- id: hierarchical-graph-probabilistic-recursive-reasoning
  title: Optimizing Multi-Agent Coordination via Hierarchical Graph Probabilistic Recursive Reasoning
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2022
  date: 2022-05-09
  venue:
    acronym: AAMAS
    name: Proceedings of the 21st International Conference on Autonomous Agents and Multiagent Systems
    pages: 290–299
  topics: [multi-agent-learning, reinforcement-learning, graph-learning, multi-agent-systems]
  links:
    pdf: https://www.ifaamas.org/Proceedings/aamas2022/pdfs/p290.pdf
    doi: 10.65109/tfia2193
    code:
      - { label: Code (GrPR2-A), url: "https://github.com/saarcohen30/GrPR2-A" }
      - { label: Code (GrPR2-CH), url: "https://github.com/saarcohen30/GrPR2-CH" }
  aliases: [/publication/2022-grpr]
  abstract: >-
    Multi-agent reinforcement learning (MARL) requires coordination by some means of interaction
    between agents to efficiently solve tasks. Interaction graphs allow reasoning about joint
    actions based on the local structure of interactions, but they disregard the potential impact of
    an agent's action on its neighbors' behaviors, which could rapidly alter in dynamic settings. In
    this paper, we thus present a novel perspective on opponent modeling in domains with only local
    interactions using (level-1) Graph Probabilistic Recursive Reasoning (GrPR2). Unlike previous
    work on recursive reasoning, each agent iteratively best-responds to other agents' policies over
    all possible local interactions. Agents' policies are approximated via a variational Bayes
    scheme for capturing their uncertainties, and we prove that an induced variant of Q-learning
    converges under self-play when there exists only one Nash equilibrium. In cooperative settings,
    we further devise a variational lower bound on the likelihood of each agent's optimality.
    Opposed to other models, optimizing the resulting objective prevents each agent from attaining
    an unrealistic modelling of others, and yields an exact tabular Q-iteration method that holds
    convergence guarantees. Then, we deepen the recursion to level-k via Cognitive Hierarchy GrPR2
    (GrPR2-CH), which lets each level-k player best-respond to a mixture of strictly lower levels in
    the hierarchy. We prove that: (1) level-3 reasoning is the optimal hierarchical level,
    maximizing each agent's expected return; and (2) the weak spot of the classical CH models is
    that 0-level is uniformly distributed, as it may introduce policy bias. Finally, we propose a
    practical actor-critic scheme, and illustrate that GrPR2-CH outperforms strong MARL baselines in
    the particle environment.

# ── 2021 ─────────────────────────────────────────────────────────────────────

- id: convexified-graph-neural-networks-robotic-swarms
  title: Convexified Graph Neural Networks for Distributed Control in Robotic Swarms
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2021
  date: 2021-08-19
  venue:
    acronym: IJCAI
    name: Proceedings of the 30th International Joint Conference on Artificial Intelligence
    pages: 2307–2313
  topics: [graph-learning, multi-robot-systems]
  links:
    paper: https://www.ijcai.org/proceedings/2021/318
    doi: 10.24963/ijcai.2021/318
    code: https://github.com/saarcohen30/convexified-gnn
  aliases: [/publication/2021-cxgnn]
  abstract: >-
    A network of robots can be viewed as a signal graph, describing the underlying network topology
    with naturally distributed architectures, whose nodes are assigned to data values associated
    with each robot. Graph neural networks (GNNs) learn representations from signal graphs, thus
    making them well-suited candidates for learning distributed controllers. Oftentimes, existing
    GNN architectures assume ideal scenarios, while ignoring the possibility that this distributed
    graph may change along time due to link failures or topology variations, which can be found in
    dynamic settings. A mismatch between the graphs on which GNNs were trained and the ones on which
    they are tested is thus formed. Utilizing online learning, GNNs can be retrained at testing
    time, overcoming this issue. However, most online algorithms are centralized and work on convex
    problems (which GNNs scarcely lead to). This paper introduces novel architectures which solve
    the convexity restriction and can be easily updated in a distributed, online manner. Finally, we
    provide experiments, showing how these models can be applied to optimizing formation control in
    a swarm of flocking robots.

- id: leading-swarm-desired-consensus
  title: On the (Im)possibility of Leading a Swarm to a Desired Consensus in Static and Dynamic Settings
  authors: [Saar Cohen, Noa Agmon]
  type: conference
  year: 2021
  date: 2021-06-04
  venue:
    acronym: DARS/SWARM
    name: Proceedings of the 4th International Symposium on Swarm Behavior and Bio-Inspired Robotics
  topics: [multi-robot-systems, multi-agent-systems]
  links:
    code: https://github.com/saarcohen30/spatial-consensus-prevention
  versions:
